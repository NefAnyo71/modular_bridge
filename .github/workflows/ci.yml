name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Analyze package
        run: dart analyze

      - name: Run package tests
        run: dart test

  analyze-and-test-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze modular_bridge_flutter
        working-directory: modular_bridge_flutter
        run: flutter pub get && flutter analyze && flutter test

      - name: Analyze example
        working-directory: example
        run: flutter pub get && flutter analyze && flutter test
