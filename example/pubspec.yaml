name: modular_bridge_example
description: "Demonstration of modular_bridge framework with Riverpod integration."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  modular_bridge:
    path: ../
  modular_bridge_flutter:
    path: ../modular_bridge_flutter

  material_ui: any

dependency_overrides:
  # modular_bridge_flutter depends on hosted modular_bridge; the example
  # tracks the local core package instead.
  modular_bridge:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
